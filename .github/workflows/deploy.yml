name: Deploy to GitHub Pages

# Publishes the game to https://<owner>.github.io/<repo>/ on every push to
# main, so it can be opened straight from a phone with no toolchain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        # Project pages are served from /<repo>/, so the asset base must match.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # These three are pinned to their current latest. They still target
      # Node 20 upstream, so the runner logs a Node 20 deprecation warning
      # that cannot be cleared from here — it is a warning, not a failure,
      # and it will go away when GitHub ships Node 24 builds of them.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
